    </filter>
  </defs>
  <rect x="3" y="3" width="114" height="114" rx="27" fill="url(#rim)"/>
  <rect x="7.5" y="7.5" width="105" height="105" rx="23" fill="url(#face)"/>
  <rect x="8.5" y="8.5" width="103" height="103" rx="22" fill="none" stroke="#ffffff" stroke-opacity=".10" stroke-width="1"/>
  <rect x="7.5" y="7.5" width="105" height="105" rx="23" fill="url(#gloss)"/>
  <text x="60" y="68" text-anchor="middle" font-family="'Arial Black','Liberation Sans',Arial,Helvetica,sans-serif" font-weight="900" font-size="45" letter-spacing="1" fill="url(#metal)" filter="url(#drop)">PNS</text>
  <rect x="31" y="79" width="58" height="1.6" fill="#8a8a8a"/>
  <rect x="31" y="80.6" width="58" height="1" fill="#000" opacity=".7"/>
  <text x="60" y="99" text-anchor="middle" font-family="'Liberation Sans',Arial,Helvetica,sans-serif" font-weight="700" font-size="11.5" letter-spacing="6" fill="#a8a8a8">EXIM</text>
