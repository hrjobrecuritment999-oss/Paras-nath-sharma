<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 120 120" width="512" height="512" role="img" aria-label="PNS Exim logo">
  <defs>
    <linearGradient id="rim" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#e4e4e4"/>
      <stop offset=".35" stop-color="#5a5a5a"/>
      <stop offset=".65" stop-color="#2b2b2b"/>
      <stop offset="1" stop-color="#b9b9b9"/>
    </linearGradient>
    <linearGradient id="face" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#2a2a2a"/>
      <stop offset=".5" stop-color="#101010"/>
      <stop offset="1" stop-color="#050505"/>
    </linearGradient>
    <linearGradient id="metal" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#ffffff"/>
      <stop offset=".42" stop-color="#b8b8b8"/>
      <stop offset=".5" stop-color="#707070"/>
      <stop offset=".62" stop-color="#cfcfcf"/>
      <stop offset="1" stop-color="#8d8d8d"/>
    </linearGradient>
    <radialGradient id="gloss" cx=".28" cy=".12" r=".9">
